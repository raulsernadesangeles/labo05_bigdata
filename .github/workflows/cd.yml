name: CD - Liquibase Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Liquibase
        run: |
          wget https://github.com/liquibase/liquibase/releases/download/v4.25.1/liquibase-4.25.1.tar.gz
          sudo mkdir -p /opt/liquibase
          sudo tar -xzf liquibase-4.25.1.tar.gz -C /opt/liquibase
          sudo ln -s /opt/liquibase/liquibase /usr/local/bin/liquibase

      - name: Download Databricks JDBC Driver
        run: |
          wget -q https://repo1.maven.org/maven2/com/databricks/databricks-jdbc/2.6.38/databricks-jdbc-2.6.38.jar
          sudo cp databricks-jdbc-2.6.38.jar /opt/liquibase/lib/

      - name: Liquibase Update
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          CLEAN_HOST=$(echo "${DATABRICKS_HOST}" | sed -e 's/^https:\/\///' -e 's/\/$//')
          liquibase --changelog-file=changelog/db.changelog-master.yaml \
                    --url="jdbc:databricks://${CLEAN_HOST}:443/default;transportMode=http;ssl=1;AuthMech=3;httpPath=${DATABRICKS_HTTP_PATH}" \
                    --username="token" \
                    --password="${DATABRICKS_TOKEN}" \
                    update
